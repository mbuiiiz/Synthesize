# docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: synthesize-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
    - "5432:5432"
    volumes:
      - ./apps/backend/db/migrations:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    
  web:
    build:
      context: . # Crucial: This tells Docker to use the root directory as the build context
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      # This syncs your local WSL code with the container for live hot-reloading
      - .:/app
      # This prevents your local WSL node_modules from overwriting the Linux container's node_modules
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: synthesize-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/apps/backend/__pycache__
    develop:
      watch:
        - path: apps/backend
          action: sync
          target: /app/apps/backend

volumes:
  postgres_data: # Defines the named volume for data persistence
