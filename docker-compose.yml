# docker-compose.yml
version: '3.8'

services:
  web:
    build:
      context: . # Crucial: This tells Docker to use the root directory as the build context
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      # This syncs your local WSL code with the container for live hot-reloading
      - .:/app
      # This prevents your local WSL node_modules from overwriting the Linux container's node_modules
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules